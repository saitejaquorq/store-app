components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
      required:
      - id
      - name
      - slug
    product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - category_id
      - name
      - price
      - created_at
      - updated_at
    product_variant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        size:
          type: string
        colour:
          type: string
        stock_quantity:
          type: integer
      required:
      - id
      - product_id
      - size
      - colour
      - stock_quantity
    product_image:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        s3_key:
          type: string
        url:
          type: string
        position:
          type: integer
      required:
      - id
      - product_id
      - s3_key
      - url
      - position
    customer_order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_reference:
          type: string
        email:
          type: string
        shipping_name:
          type: string
        shipping_line1:
          type: string
        shipping_line2:
          type: string
        shipping_city:
          type: string
        shipping_postcode:
          type: string
        shipping_country:
          type: string
        subtotal:
          type: number
        shipping_amount:
          type: number
        tax_amount:
          type: number
        grand_total:
          type: number
        currency:
          type: string
        fulfilment_stage:
          type: string
        stripe_payment_intent_id:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - order_reference
      - email
      - shipping_name
      - shipping_line1
      - shipping_city
      - shipping_postcode
      - shipping_country
      - subtotal
      - shipping_amount
      - tax_amount
      - grand_total
      - currency
      - fulfilment_stage
      - created_at
    order_item:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        variant_id:
          type: string
          format: uuid
        product_name:
          type: string
        size:
          type: string
        colour:
          type: string
        unit_price:
          type: number
        quantity:
          type: integer
        line_total:
          type: number
      required:
      - id
      - order_id
      - product_name
      - size
      - colour
      - unit_price
      - quantity
      - line_total
    admin_user:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        password_hash:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - username
      - password_hash
      - created_at
    admin_session:
      type: object
      properties:
        token:
          type: string
        admin_user_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - token
      - admin_user_id
      - expires_at
      - created_at
    store_config:
      type: object
      properties:
        id:
          type: integer
        country:
          type: string
        currency:
          type: string
        tax_rate:
          type: number
        flat_shipping_amount:
          type: number
        free_shipping_threshold:
          type: number
        pending_confirmation:
          type: boolean
      required:
      - id
      - flat_shipping_amount
      - free_shipping_threshold
      - pending_confirmation
