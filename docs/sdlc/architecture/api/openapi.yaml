paths:
  /admin/config:
    get:
      summary: Read store country, currency, tax rate, flat shipping and free threshold.
      description: Read store country, currency, tax rate, flat shipping and free
        threshold.
      operationId: get_admin_config
      parameters: []
      responses:
        '200':
          description: '{country, currency, tax_rate, flat_shipping_amount, free_shipping_threshold,
            pending_confirmation}'
      security:
      - bearerAuth: []
    put:
      summary: Set country/currency, single tax rate, flat-rate shipping and free-shipping
        threshold.
      description: Set country/currency, single tax rate, flat-rate shipping and free-shipping
        threshold.
      operationId: put_admin_config
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{country, currency, tax_rate, flat_shipping_amount, free_shipping_threshold}'
      responses:
        '200':
          description: '{...}'
      security:
      - bearerAuth: []
  /admin/login:
    post:
      summary: Verify username/password and return an opaque session token in the
        body.
      description: Verify username/password and return an opaque session token in
        the body.
      operationId: post_admin_login
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{username, password}'
      responses:
        '200':
          description: '{token, expires_at} or generic 401'
  /admin/logout:
    post:
      summary: Revoke the current session.
      description: Revoke the current session.
      operationId: post_admin_logout
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: none
      responses:
        '200':
          description: '204'
      security:
      - bearerAuth: []
  /admin/orders:
    get:
      summary: List placed orders with reference, email, total, date and stage.
      description: List placed orders with reference, email, total, date and stage.
      operationId: get_admin_orders
      parameters: []
      responses:
        '200':
          description: '[{reference, email, grand_total, created_at, stage}]'
      security:
      - bearerAuth: []
  /admin/orders/{id}:
    get:
      summary: Order detail with items, variants, quantities, totals and shipping
        address.
      description: Order detail with items, variants, quantities, totals and shipping
        address.
      operationId: get_admin_orders_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{reference, items:[...], totals, shipping_address, stage}'
      security:
      - bearerAuth: []
  /admin/orders/{id}/stage:
    patch:
      summary: Advance an order to a later fulfilment stage, recorded in-app.
      description: Advance an order to a later fulfilment stage, recorded in-app.
      operationId: patch_admin_orders_id_stage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{stage}'
      responses:
        '200':
          description: '{reference, stage}'
      security:
      - bearerAuth: []
  /admin/products:
    get:
      summary: List products for admin management.
      description: List products for admin management.
      operationId: get_admin_products
      parameters: []
      responses:
        '200':
          description: '[{id, name, category, price, is_active}]'
      security:
      - bearerAuth: []
    post:
      summary: Create a product with name, category, description and price (validated).
      description: Create a product with name, category, description and price (validated).
      operationId: post_admin_products
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{name, category_id, description, price}'
      responses:
        '200':
          description: '{id, ...} or 422'
      security:
      - bearerAuth: []
  /admin/products/{id}:
    put:
      summary: Edit a product's name, category, description or price.
      description: Edit a product's name, category, description or price.
      operationId: put_admin_products_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{name, category_id, description, price}'
      responses:
        '200':
          description: '{id, ...} or 422'
      security:
      - bearerAuth: []
  /admin/products/{id}/images:
    post:
      summary: Upload one or more product images to S3 and attach them.
      description: Upload one or more product images to S3 and attach them.
      operationId: post_admin_products_id_images
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: multipart image file(s)
      responses:
        '200':
          description: '[{id, url}]'
      security:
      - bearerAuth: []
  /admin/products/{id}/images/{image_id}:
    delete:
      summary: Remove an image from the product and delete it from media storage.
      description: Remove an image from the product and delete it from media storage.
      operationId: delete_admin_products_id_images_image_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: image_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '204'
      security:
      - bearerAuth: []
  /admin/products/{id}/variants:
    post:
      summary: Add or update size/colour variants and per-variant stock.
      description: Add or update size/colour variants and per-variant stock.
      operationId: post_admin_products_id_variants
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{size, colour, stock_quantity}'
      responses:
        '200':
          description: '{id, ...}'
      security:
      - bearerAuth: []
  /cart/validate:
    post:
      summary: Validate requested variant quantities against stock and return the
        max available where exceeded.
      description: Validate requested variant quantities against stock and return
        the max available where exceeded.
      operationId: post_cart_validate
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{items:[{variant_id, quantity}]}'
      responses:
        '200':
          description: '{items:[{variant_id, ok, max_available}]}'
  /categories:
    get:
      summary: List categories for the storefront.
      description: List categories for the storefront.
      operationId: get_categories
      parameters: []
      responses:
        '200':
          description: '[{id, name, slug}]'
  /categories/{slug}/products:
    get:
      summary: List active products in a category with thumbnail, name and price;
        empty list signals the no-products message.
      description: List active products in a category with thumbnail, name and price;
        empty list signals the no-products message.
      operationId: get_categories_slug_products
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '[{id, name, price, thumbnail_url}]'
  /checkout:
    post:
      summary: 'Place a guest order: validate in-country address, re-check stock,
        take card payment via Stripe, create order with unique'
      description: 'Place a guest order: validate in-country address, re-check stock,
        take card payment via Stripe, create order with unique reference and send
        confirmation email.'
      operationId: post_checkout
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{email, shipping_address, items:[{variant_id, quantity}],
                payment_token}'
      responses:
        '200':
          description: '{reference, grand_total, currency} or 402/409 on payment failure
            or sold-out'
  /checkout/quote:
    post:
      summary: Compute subtotal, flat-rate or free shipping, tax and grand total for
        a cart in the store currency.
      description: Compute subtotal, flat-rate or free shipping, tax and grand total
        for a cart in the store currency.
      operationId: post_checkout_quote
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{items:[{variant_id, quantity}]}'
      responses:
        '200':
          description: '{subtotal, shipping_amount, tax_amount, grand_total, currency}'
  /orders/lookup:
    post:
      summary: Return order items and current fulfilment stage only when reference
        and email both match; otherwise a generic not-found.
      description: Return order items and current fulfilment stage only when reference
        and email both match; otherwise a generic not-found.
      operationId: post_orders_lookup
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{reference, email}'
      responses:
        '200':
          description: '{reference, stage, items:[...], grand_total, currency} or
            generic error'
  /products/{id}:
    get:
      summary: Product detail with images, description, price and variants with per-variant
        stock/availability.
      description: Product detail with images, description, price and variants with
        per-variant stock/availability.
      operationId: get_products_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{id, name, description, price, images:[...], variants:[{id,
            size, colour, in_stock, available_qty}]}'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
      required:
      - id
      - name
      - slug
    product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - category_id
      - name
      - price
      - is_active
      - created_at
    product_variant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        size:
          type: string
        colour:
          type: string
        stock_quantity:
          type: integer
        sku:
          type: string
      required:
      - id
      - product_id
      - size
      - colour
      - stock_quantity
    product_image:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        s3_key:
          type: string
        position:
          type: integer
      required:
      - id
      - product_id
      - s3_key
      - position
    order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        email:
          type: string
        shipping_name:
          type: string
        shipping_address_line1:
          type: string
        shipping_address_line2:
          type: string
        shipping_city:
          type: string
        shipping_postcode:
          type: string
        shipping_country:
          type: string
        subtotal:
          type: number
        shipping_amount:
          type: number
        tax_amount:
          type: number
        grand_total:
          type: number
        currency:
          type: string
        fulfilment_stage:
          type: string
        payment_reference:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - reference
      - email
      - shipping_name
      - shipping_address_line1
      - shipping_city
      - shipping_postcode
      - shipping_country
      - subtotal
      - shipping_amount
      - tax_amount
      - grand_total
      - currency
      - fulfilment_stage
      - created_at
    order_item:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        variant_id:
          type: string
          format: uuid
        product_name:
          type: string
        size:
          type: string
        colour:
          type: string
        unit_price:
          type: number
        quantity:
          type: integer
        line_total:
          type: number
      required:
      - id
      - order_id
      - product_name
      - size
      - colour
      - unit_price
      - quantity
      - line_total
    admin_user:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        password_hash:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - username
      - password_hash
      - is_active
      - created_at
    admin_session:
      type: object
      properties:
        token:
          type: string
        admin_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
      required:
      - token
      - admin_user_id
      - created_at
      - expires_at
    store_config:
      type: object
      properties:
        id:
          type: integer
        country:
          type: string
        currency:
          type: string
        tax_rate:
          type: number
        flat_shipping_amount:
          type: number
        free_shipping_threshold:
          type: number
        pending_confirmation:
          type: boolean
      required:
      - id
      - pending_confirmation
